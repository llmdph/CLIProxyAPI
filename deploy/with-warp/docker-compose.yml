services:
  cli-proxy-api:
    image: cli-proxy-api:http-pool
    container_name: cli-proxy-api
    pull_policy: never
    restart: unless-stopped
    ports:
      - "8085:8317"
      - "8317:8317"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    environment:
      - CPA_MANAGEMENT_BASE_URL=http://127.0.0.1:8317
    volumes:
      - ./config.yaml:/CLIProxyAPI/config.yaml:rw
      - ./auths:/root/.cli-proxy-api
      - ./logs:/CLIProxyAPI/logs
      - ./static:/CLIProxyAPI/static
      - ./plugins:/CLIProxyAPI/plugins
      - ./data:/CLIProxyAPI/data
    networks:
      - default
      - grok2api
      - warp_lb

networks:
  grok2api:
    external: true
    name: grok2api_default
  warp_lb:
    external: true
    name: warp_lb_net
